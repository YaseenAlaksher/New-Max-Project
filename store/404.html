<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Page Not Found | PHI — Premium Sportswear</title>
  <meta name="description" content="The page you are looking for does not exist. Browse our premium sportswear collection at PHI." />
  <link rel="icon" type="image/png" href="images/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="images/favicon.png?v=2" />
  <link rel="stylesheet" href="style.css?v=10" />
  <style>
    .error-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-xl);
      background: var(--bg-secondary);
    }

    .error-code {
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--blue-light), var(--red-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--space-md);
      letter-spacing: -4px;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: var(--space-sm);
    }

    .error-desc {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: var(--space-xl);
      max-width: 400px;
      line-height: 1.6;
    }

    .error-illustration {
      width: 200px;
      height: 200px;
      margin-bottom: var(--space-xl);
      opacity: 0.8;
    }

    .error-btn {
      padding: var(--space-md) var(--space-2xl);
      background: linear-gradient(135deg, var(--blue-light), var(--blue-medium));
      color: var(--white);
      font-weight: 800;
      font-size: 1rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      transition: all var(--transition-base);
      text-decoration: none;
      display: inline-block;
    }

    .error-btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg), var(--shadow-glow-blue);
    }

    .error-footer {
      margin-top: var(--space-3xl);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <header class="navbar" id="navbar" role="banner">
    <strong id="logo" aria-label="PHI Home" onclick="window.location.href='index.html'" style="cursor:pointer">
      <span id="New">P</span><span id="Max">HI</span>
    </strong>
    <nav class="nav-links" id="nav-links" role="navigation" aria-label="Main navigation">
      <a href="index.html#hero">Home</a>
      <a href="index.html#products-section">Shop</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="navbar-actions">
      <button class="hamburger" id="hamburger" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu-overlay" id="mobile-overlay" aria-hidden="true"></div>

  <!-- Error Content -->
  <div class="error-page">
    <svg class="error-illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="40" y="60" width="120" height="100" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
      <path d="M40 80 L100 110 L160 80" stroke="#94A3B8" stroke-width="2" fill="none"/>
      <circle cx="100" cy="40" r="18" fill="#3B82F6" opacity="0.2"/>
      <circle cx="100" cy="40" r="12" fill="#3B82F6" opacity="0.4"/>
      <path d="M60 140 L75 125 L90 140" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M110 145 L125 130 L140 145" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="70" cy="160" r="8" fill="#1E293B" opacity="0.15"/>
      <circle cx="130" cy="155" r="6" fill="#1E293B" opacity="0.1"/>
      <text x="100" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="900" fill="#1E3A5F">?</text>
    </svg>

    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you are looking for does not exist or has been moved. Check the URL or head back to our store.</p>
    <a href="index.html" class="error-btn">← Back to Home</a>
    <p class="error-footer">PHI — Premium Sportswear</p>
  </div>

  <script>
    // Hamburger menu
    (function() {
      const hamburger = document.getElementById('hamburger');
      const navLinks = document.getElementById('nav-links');
      const overlay = document.getElementById('mobile-overlay');
      if (!hamburger || !navLinks) return;

      function closeMenu() {
        navLinks.classList.remove('open');
        hamburger.classList.remove('open');
        overlay?.classList.remove('active');
        hamburger.setAttribute('aria-expanded', 'false');
      }

      hamburger.addEventListener('click', () => {
        const isOpen = navLinks.classList.toggle('open');
        hamburger.classList.toggle('open', isOpen);
        overlay?.classList.toggle('active', isOpen);
        hamburger.setAttribute('aria-expanded', String(isOpen));
      });
      overlay?.addEventListener('click', closeMenu);
      navLinks.querySelectorAll('a').forEach(l => l.addEventListener('click', closeMenu));
    })();
  </script>
</body>

</html>
